<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa do Ceará — Turistando CE</title>
  <meta name="description"
    content="Mapa interativo do Ceará com pontos turísticos, hotéis, restaurantes, passeios e eventos usando Leaflet e OpenStreetMap.">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mapa.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <!-- ========== BARRA DE ACESSIBILIDADE ========== -->
  <aside class="acessibilidade-bar hidden" aria-label="Acessibilidade" aria-hidden="true">
    <button onclick="alterarFonte(1)" title="Aumentar fonte"><i class="fa-solid fa-plus"></i></button>
    <button onclick="alterarFonte(-1)" title="Diminuir fonte"><i class="fa-solid fa-minus"></i></button>
    <button onclick="lerPagina()" title="Leitura por voz"><i class="fa-solid fa-volume-high"></i></button>
    <button onclick="pararLeitura()" title="Parar leitura"><i class="fa-solid fa-stop"></i></button>
  </aside>

  <!-- ========== HEADER ========== -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#index.html" class="logo">
        <div class="logo-icon"><img src="images/pin.png" alt="Turistando CE"></div>
        Turistando CE
      </a>
      
      <div class="header-actions-group">
        <div class="header-actions-icon">
          <button class="btn-icon" id="btn-dark" title="Modo escuro" onclick="toggleDarkMode()">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="acessibilidade-toggle" id="btn-acessibilidade" onclick="toggleAcessibilidade()"
            aria-expanded="false" aria-label="Mostrar acessibilidade" title="Mostrar acessibilidade">
            <i class="fa-solid fa-universal-access"></i>
          </button>
        </div>

        <!-- Perfil do usuário -->
        <div class="profile-menu" id="profile-menu">
          <button class="profile-trigger" id="profile-trigger" aria-expanded="false" aria-label="Menu do usuário">
            <div class="profile-avatar" id="profile-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <span class="profile-name" id="profile-name">Entrar</span>
            <i class="fa-solid fa-chevron-down profile-arrow"></i>
          </button>
          <div class="profile-dropdown" id="profile-dropdown">
            <!-- Conteúdo preenchido via JS -->
          </div>
        </div>
      </div>
      <div class="hamburger" id="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
    </div>
  </header>
  <div class="nav-overlay" id="nav-overlay" onclick="toggleMenu()"></div>
  <div id="user-auth-mobile" class="hidden"></div>

  <main class="map-page">
    <!-- Hero -->
    <section class="map-hero">
      <div class="container map-hero__inner fade-in">
        <div class="map-hero__copy">
          <div class="map-hero__eyebrow">
            <i class="fa-solid fa-map-location-dot"></i>
            Mapa do Ceará
          </div>
          <h1>Explore praias, hotéis, restaurantes e passeios no mapa interativo.</h1>
          <p>Clique nos marcadores para ver informações de cada local.</p>
        </div>
      </div>
    </section>

    <!-- Mapa com filtros flutuantes -->
    <section class="container map-shell fade-in" aria-label="Mapa interativo do Ceará">
      <section class="map-panel">
        <!-- Filtros flutuando sobre o mapa -->
        <div class="map-float-filters" role="tablist" aria-label="Filtros do mapa">
          <button class="map-filter-btn active" data-category="all" aria-pressed="true" type="button">Todos</button>
          <button class="map-filter-btn" data-category="hotel" aria-pressed="false" type="button">Hotéis</button>
          <button class="map-filter-btn" data-category="restaurant" aria-pressed="false"
            type="button">Restaurantes</button>
          <button class="map-filter-btn" data-category="beach" aria-pressed="false" type="button">Praias</button>
          <button class="map-filter-btn" data-category="tour" aria-pressed="false" type="button">Passeios</button>
        </div>

        <div id="map" aria-label="Mapa interativo do Ceará"></div>
        <div id="map-error" class="map-error" hidden>
          <div class="map-error__box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h3>Não foi possível carregar o mapa</h3>
            <p>Tente novamente mais tarde.</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/cidades.js"></script>
  <script src="data/hoteis.js"></script>
  <script src="data/restaurantes.js"></script>
  <script src="data/passeios.js"></script>
  <script src="data/mapa-pontos.js"></script>
  <script src="js/script.js"></script>
  <script src="js/mapa.js"></script>
</body>

</html>
